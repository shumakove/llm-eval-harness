name: Eval
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # daily based at 3:00
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Eval suite to run"
        required: false
        default: "smoke"
        type: choice
        options: [smoke, regression, full]
 
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true
 
permissions:
  contents: read
 
jobs:
  eval:
    name: ${{ matrix.suite }} / ${{ matrix.model }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [correctness, safety]
        model: [baseline]
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      # TODO: `pip install -e ".[eval]"`
      - name: Install harness
        run: echo "::notice::[stub] llm-eval-harness installed"
 
      # TODO: Runner
      # python -m harness.run --suite ${{ matrix.suite }} --model ${{ matrix.model }} --out results/
      - name: Run eval suite
        run: |
          mkdir -p results
          echo "[stub] harness run --suite ${{ matrix.suite }} --model ${{ matrix.model }}"
          cat > "results/${{ matrix.suite }}-${{ matrix.model }}.json" <<'JSON'
          {
            "suite": "stub",
            "model": "stub",
            "cases": 0,
            "passed": 0,
            "failed": 0,
            "score": null,
            "note": "placeholder result - harness not implemented yet"
          }
          JSON
 
      # TODO: threshold check against results/
      - name: Check scores against thresholds
        run: echo "::notice::[stub] no thresholds configured yet - skipping gate"
 
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.suite }}-${{ matrix.model }}
          path: results/
          retention-days: 14
          if-no-files-found: ignore
 
  report:
    name: Eval report
    runs-on: ubuntu-latest
    needs: eval
    if: always()
    steps:
      - name: Write job summary
        run: |
          {
            echo "## Eval report"
            echo ""
            echo "Suite: \`${{ github.event.inputs.suite || 'smoke' }}\`"
            echo ""
            echo "| Suite | Model | Cases | Passed | Score |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| correctness | baseline | 0 | 0 | — |"
            echo "| safety | baseline | 0 | 0 | — |"
            echo ""
            echo "_Placeholder results — the harness is not wired up yet._"
          } >> "$GITHUB_STEP_SUMMARY"